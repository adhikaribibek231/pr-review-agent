[project]
name = "pr-review-agent"
version = "0.1.0"
description = "An AI agent that automatically reviews GitHub pull requests: it retrieves relevant codebase context, uses an LLM to detect bugs, security issues, and convention violations, validates each finding against the diff to eliminate hallucinations, and posts a structured review as a GitHub Action."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygithub>=2.9.1",
    "pytest>=9.1.1",
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.0.1",
    "pydantic>=2.7",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_agent"]
